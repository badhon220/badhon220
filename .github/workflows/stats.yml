
name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: h1s97x/gh-readme-card@main
        with:
          card: user
          params: "username=badhon220&show_icons=true&theme=dark"
          path: profile/user.svg

      - name: Generate Top Languages
        uses: h1s97x/gh-readme-card@main
        with:
          card: langs
          params: "username=badhon220&layout=compact&theme=dark"
          path: profile/langs.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "Update GitHub stats cards"
          git push
